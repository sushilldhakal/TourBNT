# Production compose file for the Oracle Cloud server.
#
# This file is tracked in git and synced to the server by
# .github/workflows/deploy.yml on every push to main — it is never edited by
# hand on the server. Only .env.production (holding real secrets) lives
# server-side and is not tracked here.
#
# Images are pulled from Docker Hub, not built locally, since the CI
# pipeline already builds and pushes them for linux/arm64 (Oracle's
# Ampere A1 VMs).

services:
  server:
    image: sushilldhakal/tourbnt-server:latest
    container_name: tourbnt-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/api/v1/monitoring/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: sushilldhakal/tourbnt-frontend:latest
    container_name: tourbnt-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    depends_on:
      - server
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  app-network:
    driver: bridge
