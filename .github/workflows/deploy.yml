name: Build and deploy to Oracle Cloud

# Fully automatic: every push to main builds both images and deploys them to
# the production Oracle Cloud server. There is no manual approval step — a
# broken commit on main goes live immediately.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # allows a manual re-run/redeploy from the Actions tab

env:
  DOCKERHUB_USERNAME: sushilldhakal
  IMAGE_SERVER: sushilldhakal/tourbnt-server
  IMAGE_FRONTEND: sushilldhakal/tourbnt-frontend
  # Oracle Cloud VM.Standard.A1.Flex is Ampere ARM64, not x86 — images must be
  # built for this platform or the containers won't start on the server.
  TARGET_PLATFORM: linux/arm64
  ORACLE_HOST: 161.118.228.58
  ORACLE_USER: ubuntu
  APP_DIR: /var/www/tourbnt

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Root context — server/Dockerfile needs packages/db as a sibling.
      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ env.TARGET_PLATFORM }}
          push: true
          tags: |
            ${{ env.IMAGE_SERVER }}:latest
            ${{ env.IMAGE_SERVER }}:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          platforms: ${{ env.TARGET_PLATFORM }}
          push: true
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=https://tourbnt.com
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the server's copy of docker-compose.prod.yml in sync with git —
      # never touches .env.production, which is managed only on the server.
      - name: Sync docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.ORACLE_HOST }}
          username: ${{ env.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ${{ env.APP_DIR }}
          strip_components: 0

      - name: Pull new images and restart containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.ORACLE_HOST }}
          username: ${{ env.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}

            if [ ! -f .env.production ]; then
              echo "❌ .env.production missing on server — aborting deploy."
              exit 1
            fi

            docker pull ${{ env.IMAGE_SERVER }}:latest
            docker pull ${{ env.IMAGE_FRONTEND }}:latest

            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml up -d

            echo "⏳ Waiting for health checks..."
            sleep 10
            docker ps

            echo "🧹 Pruning old images..."
            docker image prune -af
